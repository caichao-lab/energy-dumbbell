<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Copyright: 3D Wine Glass Energy Model · Original Author: Zhang Dabao · MIT License -->
    <title>3D Wine Glass · Double Sphere Wrap</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', Arial, sans-serif; }
        canvas { display: block; }
        #tooltip {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.08);
            pointer-events: none;
            z-index: 10;
            text-align: center;
        }
        #tooltip span { color: #ffd700; }
    </style>
</head>
<body>

    <div id="tooltip">🖱 Drag to Rotate · Scroll to Zoom · <span>Double Sphere Wrap</span> · Energy Dumbbell</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);

        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(12, 5, 14);
        camera.lookAt(0, 0.8, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.6;
        controls.minDistance = 6;
        controls.maxDistance = 30;
        controls.target.set(0, 0.8, 0);
        controls.update();

        // --- Lights ---
        const ambient = new THREE.AmbientLight(0x404070, 0.4);
        scene.add(ambient);

        const main = new THREE.DirectionalLight(0xffeedd, 2.0);
        main.position.set(6, 12, 8);
        main.castShadow = true;
        scene.add(main);

        const fill = new THREE.DirectionalLight(0x4488ff, 0.6);
        fill.position.set(-6, 0, 6);
        scene.add(fill);

        const back = new THREE.DirectionalLight(0x8855ff, 0.4);
        back.position.set(0, -4, -10);
        scene.add(back);

        const bottom = new THREE.PointLight(0xffd700, 0.6, 15);
        bottom.position.set(0, -3, 0);
        scene.add(bottom);

        // --- Label Helper ---
        function createLabel(text, color = '#ffffff', size = '15px') {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.color = color;
            div.style.fontSize = size;
            div.style.fontWeight = '500';
            div.style.fontFamily = 'Segoe UI, Arial, sans-serif';
            div.style.textShadow = '0 0 20px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.6)';
            div.style.letterSpacing = '0.5px';
            div.style.background = 'rgba(0,0,0,0.5)';
            div.style.padding = '3px 12px';
            div.style.borderRadius = '16px';
            div.style.backdropFilter = 'blur(4px)';
            div.style.border = '1px solid rgba(255,255,255,0.08)';
            return new CSS2DObject(div);
        }

        // ============================================================
        // 1. Two Semi-transparent Spheres (Wrap Layers)
        // ============================================================
        const centerY = 0.8;
        const outerRadius = 5.8;
        const innerRadius = 4.8;

        // Outer sphere
        const outerSphere = new THREE.Mesh(
            new THREE.SphereGeometry(outerRadius, 48, 48),
            new THREE.MeshPhysicalMaterial({
                color: 0x4488ff,
                emissive: 0x2244aa,
                emissiveIntensity: 0.05,
                transparent: true,
                opacity: 0.07,
                roughness: 0.2,
                metalness: 0.1,
                side: THREE.DoubleSide,
                depthWrite: false,
            })
        );
        outerSphere.position.y = centerY;
        scene.add(outerSphere);

        // Inner sphere
        const innerSphere = new THREE.Mesh(
            new THREE.SphereGeometry(innerRadius, 48, 48),
            new THREE.MeshPhysicalMaterial({
                color: 0x88bbff,
                emissive: 0x4466cc,
                emissiveIntensity: 0.05,
                transparent: true,
                opacity: 0.09,
                roughness: 0.2,
                metalness: 0.1,
                side: THREE.DoubleSide,
                depthWrite: false,
            })
        );
        innerSphere.position.y = centerY;
        scene.add(innerSphere);

        // ---- Labels ----
        const labelOuter = createLabel('Outer Layer (Large Sphere)', '#4488ff', '14px');
        labelOuter.position.set(7.5, 2.5, 0);
        scene.add(labelOuter);

        const labelInner = createLabel('Inner Layer (Small Sphere)', '#88bbff', '14px');
        labelInner.position.set(-7.5, 2.5, 0);
        scene.add(labelInner);

        // ============================================================
        // Wine Glass (Conversion Funnel + Channel + Profit Base)
        // ============================================================
        const wineGlassGroup = new THREE.Group();

        // Funnel
        const funnelGeo = new THREE.CylinderGeometry(2.8, 1.2, 1.8, 48, 1, true);
        const funnelMat = new THREE.MeshPhysicalMaterial({
            color: 0x8866ff,
            emissive: 0x4422aa,
            emissiveIntensity: 0.08,
            transparent: true,
            opacity: 0.15,
            roughness: 0.1,
            metalness: 0.3,
            side: THREE.DoubleSide,
            depthWrite: false,
        });
        const funnel = new THREE.Mesh(funnelGeo, funnelMat);
        funnel.position.y = 1.8;
        wineGlassGroup.add(funnel);

        // Funnel top rim
        const rim = new THREE.Mesh(
            new THREE.TorusGeometry(2.8, 0.04, 16, 48),
            new THREE.MeshPhysicalMaterial({
                color: 0xaa88ff,
                emissive: 0x6633cc,
                emissiveIntensity: 0.2,
                transparent: true,
                opacity: 0.6,
            })
        );
        rim.position.y = 2.7;
        rim.rotation.x = Math.PI / 2;
        wineGlassGroup.add(rim);

        // Funnel bottom rim
        const rimBottom = new THREE.Mesh(
            new THREE.TorusGeometry(1.2, 0.03, 16, 32),
            new THREE.MeshPhysicalMaterial({
                color: 0x8866ff,
                emissive: 0x4422aa,
                emissiveIntensity: 0.15,
                transparent: true,
                opacity: 0.4,
            })
        );
        rimBottom.position.y = 0.9;
        rimBottom.rotation.x = Math.PI / 2;
        wineGlassGroup.add(rimBottom);

        // Funnel particles
        for (let i = 0; i < 30; i++) {
            const t = Math.random();
            const r = 1.2 + t * 1.6;
            const angle = Math.random() * Math.PI * 2;
            const y = 0.9 + t * 1.8;
            const p = new THREE.Mesh(
                new THREE.SphereGeometry(0.04, 4, 4),
                new THREE.MeshBasicMaterial({ color: 0xaa88ff, transparent: true, opacity: 0.3 + Math.random() * 0.3 })
            );
            p.position.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
            wineGlassGroup.add(p);
        }

        // Channel
        const channel = new THREE.Mesh(
            new THREE.CylinderGeometry(1.0, 1.0, 1.6, 32),
            new THREE.MeshPhysicalMaterial({
                color: 0x7755dd,
                emissive: 0x331188,
                emissiveIntensity: 0.1,
                transparent: true,
                opacity: 0.12,
                roughness: 0.2,
                metalness: 0.4,
                side: THREE.DoubleSide,
                depthWrite: false,
            })
        );
        channel.position.y = 0.0;
        wineGlassGroup.add(channel);

        // Channel glow rings
        for (let i = -1; i <= 1; i++) {
            const ring = new THREE.Mesh(
                new THREE.TorusGeometry(1.05, 0.03, 12, 32),
                new THREE.MeshPhysicalMaterial({
                    color: 0x8866ff,
                    emissive: 0x4422aa,
                    emissiveIntensity: 0.15,
                    transparent: true,
                    opacity: 0.3,
                })
            );
            ring.position.y = i * 0.7;
            ring.rotation.x = Math.PI / 2;
            wineGlassGroup.add(ring);
        }

        // Profit Base
        const base = new THREE.Mesh(
            new THREE.CylinderGeometry(0.2, 3.2, 2.8, 48, 1, true),
            new THREE.MeshPhysicalMaterial({
                color: 0xffd700,
                emissive: 0x886600,
                emissiveIntensity: 0.06,
                transparent: true,
                opacity: 0.10,
                roughness: 0.1,
                metalness: 0.5,
                side: THREE.DoubleSide,
                depthWrite: false,
            })
        );
        base.position.y = -1.6;
        wineGlassGroup.add(base);

        // Base glow ring
        const baseRing = new THREE.Mesh(
            new THREE.TorusGeometry(3.2, 0.05, 16, 48),
            new THREE.MeshPhysicalMaterial({
                color: 0xffd700,
                emissive: 0xaa8800,
                emissiveIntensity: 0.2,
                transparent: true,
                opacity: 0.4,
            })
        );
        baseRing.position.y = -3.0;
        baseRing.rotation.x = Math.PI / 2;
        wineGlassGroup.add(baseRing);

        // Base glow disc
        const baseGlow = new THREE.Mesh(
            new THREE.CircleGeometry(3.0, 48),
            new THREE.MeshBasicMaterial({
                color: 0xffd700,
                transparent: true,
                opacity: 0.04,
                side: THREE.DoubleSide,
            })
        );
        baseGlow.position.y = -3.0;
        baseGlow.rotation.x = -Math.PI / 2;
        wineGlassGroup.add(baseGlow);

        wineGlassGroup.position.set(0, 0.8, 0);
        scene.add(wineGlassGroup);

        // Wine glass labels
        const labelFunnel = createLabel('Conversion Funnel', '#aa88ff', '13px');
        labelFunnel.position.set(3.8, 3.2, 0);
        scene.add(labelFunnel);

        const labelChannel = createLabel('Conversion Channel', '#8866ff', '13px');
        labelChannel.position.set(-3.2, 0.6, 0);
        scene.add(labelChannel);

        const labelBase = createLabel('Profit Base', '#ffd700', '13px');
        labelBase.position.set(4.2, -2.4, 0);
        scene.add(labelBase);

        // --- Two Grapes: Product & Customer ---
        const productGroup = new THREE.Group();
        const grapeGeo = new THREE.SphereGeometry(0.55, 24, 24);
        const grapeMat = new THREE.MeshPhysicalMaterial({
            color: 0xff6633,
            emissive: 0x881100,
            emissiveIntensity: 0.15,
            roughness: 0.2,
            metalness: 0.1,
            clearcoat: 0.3,
            clearcoatRoughness: 0.4,
            transparent: true,
            opacity: 0.92,
        });
        const grape1 = new THREE.Mesh(grapeGeo, grapeMat);
        grape1.castShadow = true;
        productGroup.add(grape1);

        const highlight1 = new THREE.Mesh(
            new THREE.SphereGeometry(0.18, 12, 12),
            new THREE.MeshBasicMaterial({ color: 0xffaa77, transparent: true, opacity: 0.3 })
        );
        highlight1.position.set(0.2, 0.2, 0.3);
        productGroup.add(highlight1);

        const labelProduct = createLabel('Product (Push Force)', '#ff6633', '13px');
        labelProduct.position.set(0, -1.0, 0);
        productGroup.add(labelProduct);

        productGroup.position.set(-1.6, 2.6, 0);
        scene.add(productGroup);

        const customerGroup = new THREE.Group();
        const grapeMat2 = new THREE.MeshPhysicalMaterial({
            color: 0x33ccff,
            emissive: 0x004488,
            emissiveIntensity: 0.15,
            roughness: 0.2,
            metalness: 0.1,
            clearcoat: 0.3,
            clearcoatRoughness: 0.4,
            transparent: true,
            opacity: 0.92,
        });
        const grape2 = new THREE.Mesh(grapeGeo, grapeMat2);
        grape2.castShadow = true;
        customerGroup.add(grape2);

        const highlight2 = new THREE.Mesh(
            new THREE.SphereGeometry(0.18, 12, 12),
            new THREE.MeshBasicMaterial({ color: 0x88ddff, transparent: true, opacity: 0.3 })
        );
        highlight2.position.set(-0.2, 0.2, 0.3);
        customerGroup.add(highlight2);

        const labelCustomer = createLabel('Customer (Pull Force)', '#33ccff', '13px');
        labelCustomer.position.set(0, -1.0, 0);
        customerGroup.add(labelCustomer);

        customerGroup.position.set(1.6, 2.6, 0);
        scene.add(customerGroup);

        // --- Three-Wave Sphere (Profit Core) ---
        const sphereGroup = new THREE.Group();

        const sphere = new THREE.Mesh(
            new THREE.SphereGeometry(1.6, 48, 48),
            new THREE.MeshPhysicalMaterial({
                color: 0xffd700,
                emissive: 0x886600,
                emissiveIntensity: 0.1,
                transparent: true,
                opacity: 0.15,
                roughness: 0.1,
                metalness: 0.3,
                side: THREE.DoubleSide,
                depthWrite: false,
            })
        );
        sphereGroup.add(sphere);

        const wire = new THREE.Mesh(
            new THREE.SphereGeometry(1.6, 16, 12),
            new THREE.MeshBasicMaterial({
                color: 0xffdd44,
                wireframe: true,
                transparent: true,
                opacity: 0.08,
            })
        );
        sphereGroup.add(wire);

        const core = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 })
        );
        sphereGroup.add(core);

        const glowCore = new THREE.Mesh(
            new THREE.SphereGeometry(0.35, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffdd44, transparent: true, opacity: 0.15 })
        );
        sphereGroup.add(glowCore);

        // Three wave rings
        const waves = [];
        const waveColors = [0xff6644, 0x44ddff, 0xffd700];
        for (let w = 0; w < 3; w++) {
            const waveGroup = new THREE.Group();
            const rings = [];
            for (let i = 0; i < 8; i++) {
                const r = 0.6 + i * 0.25;
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(r, 0.015, 8, 32),
                    new THREE.MeshBasicMaterial({
                        color: waveColors[w],
                        transparent: true,
                        opacity: 0.15 + (i / 8) * 0.2,
                    })
                );
                ring.rotation.x = Math.PI / 2 + (i * 0.05);
                ring.position.y = 0;
                waveGroup.add(ring);
                rings.push({ mesh: ring, baseRadius: r, phase: i * 0.5 });
            }
            waveGroup.userData = { rings, offset: w * 2.1 };
            sphereGroup.add(waveGroup);
            waves.push(waveGroup);
        }

        const labelSphere = createLabel('Three-Wave Sphere (Profit Core)', '#ffd700', '14px');
        labelSphere.position.set(2.5, -1.8, 0);
        sphereGroup.add(labelSphere);

        const labelCore = createLabel('Profit Core', '#ffffff', '12px');
        labelCore.position.set(0.8, 0.8, 0);
        sphereGroup.add(labelCore);

        sphereGroup.position.set(0, -1.8, 0);
        scene.add(sphereGroup);

        // --- Idle Entities ---
        for (let i = 0; i < 25; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = 0.8 + Math.random() * 1.8;
            const y = 0.5 + Math.random() * 2.0;
            const p = new THREE.Mesh(
                new THREE.SphereGeometry(0.04, 6, 6),
                new THREE.MeshBasicMaterial({
                    color: 0x88dd88,
                    transparent: true,
                    opacity: 0.2 + Math.random() * 0.2,
                })
            );
            p.position.set(Math.cos(angle) * r, y + 0.8, Math.sin(angle) * r);
            scene.add(p);
        }

        for (let i = 0; i < 30; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = 4.2 + Math.random() * 0.8;
            const y = -0.5 + Math.random() * 2.5;
            const p = new THREE.Mesh(
                new THREE.SphereGeometry(0.05, 6, 6),
                new THREE.MeshBasicMaterial({
                    color: 0x88ddff,
                    transparent: true,
                    opacity: 0.15 + Math.random() * 0.15,
                })
            );
            p.position.set(Math.cos(angle) * r, y + 0.8, Math.sin(angle) * r);
            scene.add(p);
        }

        const labelIdle1 = createLabel('Idle Entity (Inside)', '#88dd88', '12px');
        labelIdle1.position.set(-2.8, 3.6, 2.5);
        scene.add(labelIdle1);

        const labelIdle2 = createLabel('Idle Entity (Outside)', '#88ddff', '12px');
        labelIdle2.position.set(4.2, 2.0, 3.5);
        scene.add(labelIdle2);

        // --- Dark Channel ---
        const tubePoints = [
            new THREE.Vector3(0, 2.2, 0),
            new THREE.Vector3(0, 0.2, 0),
            new THREE.Vector3(0, -0.5, 0),
        ];
        const tubeCurve = new THREE.CatmullRomCurve3(tubePoints);
        const tube = new THREE.Mesh(
            new THREE.TubeGeometry(tubeCurve, 20, 0.06, 6, false),
            new THREE.MeshPhysicalMaterial({
                color: 0xffd700,
                emissive: 0x886600,
                emissiveIntensity: 0.2,
                transparent: true,
                opacity: 0.15,
                roughness: 0.3,
                metalness: 0.5,
                side: THREE.DoubleSide,
                depthWrite: false,
            })
        );
        scene.add(tube);

        const flowParticles = [];
        for (let i = 0; i < 15; i++) {
            const t = i / 15;
            const p = new THREE.Mesh(
                new THREE.SphereGeometry(0.04, 6, 6),
                new THREE.MeshBasicMaterial({
                    color: 0xffd700,
                    transparent: true,
                    opacity: 0.2 + Math.random() * 0.3,
                })
            );
            const pos = tubeCurve.getPoint(t);
            p.position.copy(pos);
            p.userData = { t, speed: 0.005 + Math.random() * 0.005 };
            scene.add(p);
            flowParticles.push(p);
        }

        const labelTube = createLabel('Dark Channel (Direct to Profit Core)', '#ffd700', '12px');
        labelTube.position.set(-1.2, 0.8, 1.5);
        scene.add(labelTube);

        // --- Replication Trigger ---
        const copyParticles = [];
        for (let i = 0; i < 25; i++) {
            const angle = (i / 25) * Math.PI * 2 + Math.random() * 0.2;
            const r = 2.0 + Math.random() * 1.5;
            const p = new THREE.Mesh(
                new THREE.SphereGeometry(0.05, 6, 6),
                new THREE.MeshBasicMaterial({
                    color: 0xff6644,
                    transparent: true,
                    opacity: 0.2 + Math.random() * 0.3,
                })
            );
            p.position.set(Math.cos(angle) * r, -3.8 + Math.random() * 0.3, Math.sin(angle) * r);
            scene.add(p);
            copyParticles.push(p);
        }

        const labelCopy = createLabel('Replication Trigger (Quantity → Quality)', '#ff6644', '14px');
        labelCopy.position.set(0, -4.6, 0);
        scene.add(labelCopy);

        // ============================================================
        // Animation Loop
        // ============================================================
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            controls.update();

            // Grape sway
            const swayX = Math.sin(time * 0.8) * 0.3;
            const swayZ = Math.cos(time * 0.9) * 0.15;
            productGroup.position.x = -1.6 + swayX;
            productGroup.position.z = swayZ;
            productGroup.rotation.z = Math.sin(time * 0.8) * 0.04;
            productGroup.position.y = 2.6 + Math.sin(time * 0.5) * 0.08;

            const swayX2 = Math.sin(time * 0.6 + 0.5) * 0.25;
            const swayZ2 = Math.cos(time * 0.7 + 0.3) * 0.12;
            customerGroup.position.x = 1.6 + swayX2;
            customerGroup.position.z = swayZ2;
            customerGroup.rotation.z = -Math.sin(time * 0.6 + 0.3) * 0.04;
            customerGroup.position.y = 2.6 + Math.sin(time * 0.4 + 0.5) * 0.08;

            const breathe = 1 + Math.sin(time * 0.8) * 0.02;
            productGroup.scale.set(breathe, breathe, breathe);
            customerGroup.scale.set(breathe, breathe, breathe);

            // Wave rings
            waves.forEach((waveGroup) => {
                const rings = waveGroup.userData.rings;
                const offset = waveGroup.userData.offset;
                rings.forEach((ringData, i) => {
                    const scale = 1 + Math.sin(time * 0.6 + i * 0.2 + offset) * 0.1;
                    ringData.mesh.scale.set(scale, scale, scale);
                    ringData.mesh.material.opacity = 0.1 + (i / 8) * 0.15 +
                        Math.sin(time * 0.7 + i * 0.2 + offset) * 0.05;
                    ringData.mesh.rotation.x = Math.PI / 2 + Math.sin(time * 0.5 + i * 0.1 + offset) * 0.05;
                });
            });

            sphere.material.emissiveIntensity = 0.06 + Math.sin(time * 0.5) * 0.04;

            flowParticles.forEach((p) => {
                p.userData.t += p.userData.speed;
                if (p.userData.t > 1) p.userData.t = 0;
                const pos = tubeCurve.getPoint(p.userData.t);
                p.position.copy(pos);
            });

            baseRing.material.emissiveIntensity = 0.15 + Math.sin(time * 0.7) * 0.08;

            copyParticles.forEach((p, i) => {
                p.material.opacity = 0.15 + Math.sin(time * 0.5 + i * 0.5) * 0.15;
            });

            outerSphere.material.opacity = 0.07 + Math.sin(time * 0.2) * 0.02;
            innerSphere.material.opacity = 0.09 + Math.sin(time * 0.2 + 0.5) * 0.02;

            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        animate();

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Toggle auto-rotate on click ---
        renderer.domElement.addEventListener('click', () => {
            controls.autoRotate = !controls.autoRotate;
        });

        console.log('🎯 Double Sphere Wrap Model Loaded (English Version)');
    </script>
    <div style="position:fixed;bottom:6px;right:12px;font-size:11px;color:#888;opacity:0.6;z-index:9999;pointer-events:none;font-family:sans-serif;">
        3D Model © Zhang Dabao · MIT
    </div>
</body>
</html>
